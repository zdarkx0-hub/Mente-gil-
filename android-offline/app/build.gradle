plugins {
    id "com.android.application"
}

android {
    namespace "com.menteagil.offline"
    compileSdk 35

    defaultConfig {
        // Permanent beta identity: never change this for a routine update.
        applicationId "com.menteagil.offline.beta"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "1.3.0-beta"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            minifyEnabled false
        }
        release {
            // CI produces an unsigned APK. scripts/sign_beta.py signs it privately.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
