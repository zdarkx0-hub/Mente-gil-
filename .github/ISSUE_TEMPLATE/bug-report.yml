name: Relatar um erro
description: Informe um problema reproduzível no site ou aplicativo.
title: "[Bug]: "
body:
  - type: dropdown
    id: platform
    attributes:
      label: Onde ocorreu?
      options:
        - Site no computador
        - Site no celular ou PWA
        - Aplicativo Android
        - Servidor ou ranking
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Explique o resultado observado e o que deveria ter acontecido.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
      placeholder: |
        1. Abra...
        2. Toque em...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: "Exemplo: 1.2.0"
  - type: textarea
    id: device
    attributes:
      label: Dispositivo e navegador
      placeholder: "Exemplo: Android 14, Chrome 140"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi senhas, tokens e dados pessoais do relato.
          required: true
