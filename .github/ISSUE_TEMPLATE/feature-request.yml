name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou melhoria para o Mente Ágil.
title: "[Ideia]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema essa ideia resolve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Como você imagina a solução?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área principal
      options:
        - Treinos
        - Revisão e progresso
        - Ranking
        - Conta e privacidade
        - Offline e PWA
        - Aplicativo Android
        - Interface e acessibilidade
    validations:
      required: true
