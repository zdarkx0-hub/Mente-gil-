name: Build Offline APK

on:
  pull_request:
    paths:
      - "android-offline/**"
      - ".github/workflows/build-offline-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android-offline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test calculation engine
        run: node --test tests/*.test.cjs

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mente-Agil-Offline-v1.0.0.apk
          sha256sum Mente-Agil-Offline-v1.0.0.apk > Mente-Agil-Offline-v1.0.0.apk.sha256

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mente-Agil-Offline-1.0.0
          path: |
            android-offline/Mente-Agil-Offline-v1.0.0.apk
            android-offline/Mente-Agil-Offline-v1.0.0.apk.sha256
          if-no-files-found: error
