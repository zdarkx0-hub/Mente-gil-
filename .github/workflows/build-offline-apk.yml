name: Build Mobile APK

on:
  pull_request:
    paths:
      - "android-offline/**"
      - ".github/workflows/build-offline-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android-offline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: android-offline/package-lock.json

      - name: Test mobile features and data compatibility
        run: |
          npm ci --ignore-scripts
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare unsigned beta for private signing
        run: |
          mkdir -p beta-build/tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk beta-build/
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 beta-build/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" beta-build/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" beta-build/tools/
          cd beta-build
          sha256sum app-release-unsigned.apk tools/apksigner.jar tools/aapt2 > SHA256SUMS

      - name: Publish unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mente-Agil-Beta-Unsigned
          path: |
            android-offline/beta-build/
          if-no-files-found: error
