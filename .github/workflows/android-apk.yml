name: Build Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Mente-Agil-v1.2.0.apk
          sha256sum Mente-Agil-v1.2.0.apk > Mente-Agil-v1.2.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mente-Agil-APK-v1.2.0
          path: |
            Mente-Agil-v1.2.0.apk
            Mente-Agil-v1.2.0.apk.sha256
          if-no-files-found: error
