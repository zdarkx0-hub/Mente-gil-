name: Validate Mente Agil

on:
  push:
    paths:
      - "app/**"
      - "worker/**"
      - "shared/**"
      - "tests/**"
      - "public/**"
      - "database/**"
      - "drizzle/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
